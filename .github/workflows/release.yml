name: release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    name: Build & release tarball
    runs-on: ubuntu-latest

    steps:
      - name: Check out the tag
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify
        # Lint, type-check, and run unit tests before publishing.
        run: |
          pnpm lint
          pnpm typecheck
          pnpm test

      - name: Build distribution
        run: pnpm build

      - name: Pack tarball
        # `pnpm pack` writes <name>-<version>.tgz to the project root.
        run: |
          pnpm pack
          mkdir -p artifacts
          mv *.tgz artifacts/
          ls -la artifacts/

      - name: Determine version
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tarball=prosemirror-freeze-plugin-$VERSION.tgz" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release with tarball
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: artifacts/${{ steps.version.outputs.tarball }}
          body: |
            Install with pnpm directly from this release:

            ```bash
            pnpm add https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/${{ steps.version.outputs.tarball }}
            ```
